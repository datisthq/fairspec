packages:
  - standard
  - desktop
  - typescript
  - typescript/*
  - python
  - catalog

# Supply-chain hardening. Quarantine freshly-published versions for seven days: a
# compromised-maintainer publish is typically detected and yanked within hours, so a version
# that survives the window is very unlikely to be the malicious one. Seven days is also the
# threshold the supply-chain rule in `pnpm vulns` enforces.
#
# When a genuine hotfix has to land sooner, pin that one version into minimumReleaseAgeExclude
# (exact version, with a note saying why) rather than lowering this number for the whole tree.
minimumReleaseAge: 10080

# Our own published packages are exempt from the quarantine. The gate defends against a
# compromised maintainer we do not control; for these we ARE the maintainer, and the release
# flow is release-please publishing from CI. Without this, our own publish -> consume loop
# would stall for a week. Unversioned entries cover every version and are never auto-pruned.
#
# Note this is the one thing the age gate cannot protect: if our own npm publishing were
# compromised, these would sail through. trustPolicy: no-downgrade is the control for that.
minimumReleaseAgeExclude:
  - "@fairspec/*"
  - livemark
  - vitest-polly
minimumReleaseAgeExcludePrune: true

saveExact: true

allowBuilds:
  "@parcel/watcher": true
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
  workerd: true

catalog:
  "@tanstack/react-router": 1.170.7
  "@tanstack/react-start": 1.168.49
  "@types/node": 24.2.0
  "@types/react": 19.2.2
  "@types/react-dom": 19.2.0
  "@typescript/native-preview": 7.0.0-dev.20260507.1
  "@vitest/coverage-v8": 5.0.1
  cn: 0.2.4
  lucide-react: 0.577.0
  react: 19.2.6
  react-dom: 19.2.6
  tempy: 3.1.2
  type-fest: 4.41.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  xlsx: "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
