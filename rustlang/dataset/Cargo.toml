[package]
name = "fairspec-dataset"
description = "Fairspec dataset: file and stream I/O and dataset source plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fairspec_dataset"

[dependencies]
base64 = "0.23.1"
fairspec-metadata = { path = "../metadata" }
libc = "0.2.191"
md-5 = "0.11.0"
indexmap = { version = "2.14", features = ["serde"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27"
thiserror = "2.0"
ureq = "3.5"
url = "2.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_norway = "0.9"
tempfile = "3.27"
