[workspace]
members = [
  "metadata",
  "dataset",
  "table",
  "library",
  "mcp-server",
  "terminal",
  "fairspec",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/datisthq/fairspec"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
