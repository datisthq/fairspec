[package]
name = "fairspec-table"
description = "Fairspec table: the Polars-backed table engine and file-format plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fairspec_table"

[dependencies]
calamine = { version = "0.36", features = ["chrono"] }
chrono = "0.4"
encoding_rs = "0.8"
fairspec-dataset = { path = "../dataset" }
fairspec-metadata = { path = "../metadata" }
indexmap = { version = "2.14.2", features = ["serde"] }
polars = { version = "0.55", default-features = false, features = [
  "lazy",
  "strings",
  "regex",
  "temporal",
  "timezones",
  "dtype-full",
  "csv",
  "json",
  "parquet",
  "ipc",
  "sql",
  "is_in",
  "concat_str",
  "list_eval",
  "cum_agg",
  "round_series",
  "abs",
  "dtype-struct",
  "fmt",
  "cse",
  "string_pad",
  "replace",
  "extract_jsonpath",
  "row_hash",
  "streaming",
] }
regex = "1.13"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.101"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
