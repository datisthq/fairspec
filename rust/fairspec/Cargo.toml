[package]
name = "fairspec"
description = "Fairspec: a fast data management framework built on the Fairspec standard and Polars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fairspec"

[dependencies]
fairspec-library = { path = "../library" }
fairspec-terminal = { path = "../terminal" }

[[bin]]
name = "fairspec"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
