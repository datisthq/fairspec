[package]
name = "fairspec-library"
description = "Fairspec library: the plugin registry and the actions every interface calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "fairspec_library"

[dependencies]
fairspec-dataset.workspace = true
fairspec-metadata.workspace = true
fairspec-table.workspace = true
polars = { version = "0.55", default-features = false, features = [
  "lazy",
  "semi_anti_join",
] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[features]
nightly = ["fairspec-table/nightly"]

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27"
