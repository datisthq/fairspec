[workspace]
members = [
  "metadata",
  "dataset",
  "table",
  "library",
  "mcp-server",
  "terminal",
  "fairspec",
  "../benchmark/fairspec/rust",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/datisthq/fairspec"
homepage = "https://fairspec.org"

# Path and version both: a published crate keeps only the version
[workspace.dependencies]
fairspec-metadata = { path = "metadata", version = "0.2.0" }
fairspec-dataset = { path = "dataset", version = "0.2.0" }
fairspec-table = { path = "table", version = "0.2.0" }
fairspec-library = { path = "library", version = "0.2.0" }
fairspec-mcp-server = { path = "mcp-server", version = "0.2.0" }
fairspec-terminal = { path = "terminal", version = "0.2.0" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

# py-polars' wheel profile
[profile.dist-release]
inherits = "release"
codegen-units = 1
lto = "fat"

# The polars py-polars 2.0.0 ships (its `Build:` commit), not crates.io 0.55.2
[patch.crates-io]
polars = { git = "https://github.com/pola-rs/polars", rev = "22a147de3d2bb2e44b97338a2510816c7105c9f2" }
# polars calls the prefetch methods of its own fork (rust-lang/hashbrown#727)
hashbrown = { git = "https://github.com/pola-rs/hashbrown", rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a" }
