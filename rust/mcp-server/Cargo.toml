[package]
name = "fairspec-mcp-server"
description = "Fairspec MCP server: MCP tools over the library actions, served over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "fairspec_mcp_server"

[dependencies]
fairspec-library.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rmcp = { version = "3.6", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[[test]]
name = "stdout"
harness = false

[dev-dependencies]
libc = "0.2"
