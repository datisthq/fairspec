[package]
name = "fairspec-terminal"
description = "Fairspec terminal: the fairspec command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "fairspec_terminal"

[dependencies]
clap = { version = "4.6.7", features = ["wrap_help"] }
fairspec-library.workspace = true
fairspec-mcp-server.workspace = true
fireargs = "0.3.0"
indexmap = { version = "2.14.2", features = ["serde"] }
pollster = "1.0.1"
regex = "1.13.1"
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
