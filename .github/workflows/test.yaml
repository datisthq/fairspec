name: test

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      standard: ${{ github.event_name != 'pull_request' || steps.filter.outputs.standard == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      typescript: ${{ github.event_name != 'pull_request' || steps.filter.outputs.typescript == 'true' }}
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Filter Changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            root: &root
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
              - vite.config.ts
              - .github/workflows/test.yaml
            standard:
              - *root
              - standard/**
            desktop:
              - *root
              - desktop/**
              - typescript/**
            python:
              - *root
              - python/**
              - testsuite/**
            typescript:
              - *root
              - typescript/**
              - testsuite/**
            site:
              - *root
              - .livemark/**
              - livemark.config.ts
              - worker.ts
              - wrangler.jsonc
              - CONTRIBUTING.md
              - "*/README.md"
              - "*/CHANGELOG.md"
              - standard/**
              - python/project/docs/**
              - typescript/project/docs/**

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Lint Repo
        run: pnpm check:lint
      - name: Check Docs
        run: pnpm exec vp test
      - name: Check Root Types
        run: pnpm exec tsgo --noEmit

  standard:
    needs: [changes]
    if: needs.changes.outputs.standard == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Test Standard
        run: pnpm -C standard test

  typescript:
    needs: [changes]
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm -C typescript build
      - name: Check Types
        if: runner.os == 'Linux'
        run: pnpm -C typescript check:types
      - name: Test Packages
        if: runner.os != 'Linux'
        run: pnpm -C typescript test:unit
      - name: Test Packages With Coverage
        if: runner.os == 'Linux'
        run: pnpm -C typescript measure:coverage
      - name: Upload Coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          flags: typescript
          directory: typescript/coverage

  desktop:
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Libraries
        run: pnpm -C typescript build
      - name: Test Desktop
        run: pnpm -C desktop test
      - name: Build Desktop
        run: pnpm -C desktop build

  python:
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    permissions:
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install && pnpm -C python setup
      - name: Test Packages
        run: pnpm -C python test
      - name: Upload Coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          use_oidc: true
          flags: python
          directory: python

  site:
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Site
        run: pnpm build:site

  test:
    needs: [lint, standard, typescript, desktop, python, site]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
