name: release

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  release:
    needs: [test]
    runs-on: ubuntu-latest

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Release Project
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: .release/config.json
          manifest-file: .release/manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Release Branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please"))][0].headRefName')
          echo "name=${name:-}" >> "$GITHUB_OUTPUT"

      - name: Checkout Release Branch
        if: steps.branch.outputs.name != ''
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.branch.outputs.name }}
      - name: Setup Pnpm
        if: steps.branch.outputs.name != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        if: steps.branch.outputs.name != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        if: steps.branch.outputs.name != ''
        run: pnpm install
      - name: Generate Profiles
        if: steps.branch.outputs.name != ''
        run: pnpm generate
      - name: Commit Profiles
        if: steps.branch.outputs.name != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .livemark/public/profiles
          git diff --cached --quiet || git commit -m "chore: generate the versioned profiles"
          git push
