name: release

on:
  push:
    branches:
      - main

# Never cancel: a run cancelled after tagging leaves a release no later run publishes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

    permissions:
      id-token: write
      pull-requests: read

  release:
    needs: [test]
    runs-on: ubuntu-latest

    outputs:
      standard: ${{ steps.release.outputs['standard--release_created'] }}
      desktop: ${{ steps.release.outputs['desktop--release_created'] }}
      desktop-tag: ${{ steps.release.outputs['desktop--tag_name'] }}
      python: ${{ steps.release.outputs['python--release_created'] }}
      rust: ${{ steps.release.outputs['rust--release_created'] }}
      rust-tag: ${{ steps.release.outputs['rust--tag_name'] }}
      rust-version: ${{ steps.release.outputs['rust--version'] }}
      typescript: ${{ steps.release.outputs['typescript--release_created'] }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Release Sections
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: .release/config.json
          manifest-file: .release/manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign Release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' |
            xargs -r -I{} gh api "repos/$GITHUB_REPOSITORY/issues/{}/assignees" -f "assignees[]=roll"

  profiles:
    needs: [release]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Find Release Branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName == "release-please--branches--main")][0].headRefName')
          echo "name=${name:-}" >> "$GITHUB_OUTPUT"

      - name: Checkout Release Branch
        if: steps.branch.outputs.name != ''
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.branch.outputs.name }}
      - name: Setup Pnpm
        if: steps.branch.outputs.name != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        if: steps.branch.outputs.name != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        if: steps.branch.outputs.name != ''
        run: pnpm install
      - name: Generate Profiles
        if: steps.branch.outputs.name != ''
        run: pnpm generate:profiles
      - name: Bundle Profiles
        if: steps.branch.outputs.name != ''
        run: pnpm sync:profiles
      - name: Commit Profiles
        if: steps.branch.outputs.name != ''
        env:
          LEFTHOOK: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .livemark/public/profiles typescript/metadata python/metadata/fairspec_metadata rust/metadata
          git diff --cached --quiet || git commit -m "chore: generate and bundle the release profiles"
          git push

  desktop:
    needs: [release]
    if: needs.release.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Libraries
        run: pnpm -C typescript build
      - name: Build App
        run: pnpm -C desktop build
      - name: Compile App
        run: pnpm -C desktop compile
      - name: Hash Installers
        shell: bash
        working-directory: desktop/compile
        run: |
          shopt -s nullglob
          for f in *.AppImage *.deb *.dmg *.exe; do (sha256sum "$f" || shasum -a 256 "$f") > "$f.sha256"; done
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.desktop-tag }}
          files: |
            desktop/compile/*.AppImage
            desktop/compile/*.deb
            desktop/compile/*.dmg
            desktop/compile/*.exe
            desktop/compile/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    needs: [release]
    if: needs.release.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          # 22.04 for the oldest glibc the binary links against
          - { runner: ubuntu-22.04, os: linux, arch: x64, archive: tar.gz }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, archive: tar.gz }
          - { runner: macos-15-intel, os: macos, arch: x64, archive: tar.gz }
          - { runner: macos-latest, os: macos, arch: arm64, archive: tar.gz }
          - { runner: windows-latest, os: windows, arch: x64, archive: zip }

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      NAME: fairspec-terminal-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.release.outputs.rust-version }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Rust
        run: rustup toolchain install nightly-2026-09-01 --profile minimal
      - name: Build Binary
        working-directory: rust
        run: cargo +nightly-2026-09-01 build --locked --profile dist-release --features fairspec-library/nightly -p fairspec
      - name: Pack Binary
        run: |
          mkdir dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "dist/$NAME.zip" ./rust/target/dist-release/fairspec.exe
          else
            tar -czf "dist/$NAME.tar.gz" -C rust/target/dist-release fairspec
          fi
          cd dist && for f in *; do (sha256sum "$f" || shasum -a 256 "$f") > "$f.sha256"; done
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release.outputs.rust-tag }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates:
    needs: [release, rust]
    environment: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Authenticate Crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish Packages
        working-directory: rust
        run: cargo publish --workspace --exclude fairspec-benchmark
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    needs: [release]
    if: needs.release.outputs.python == 'true'
    environment: release
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install && pnpm -C python setup
      - name: Build Packages
        run: pnpm -C python build
      - name: Publish Packages
        run: pnpm -C python release

  typescript:
    needs: [release]
    if: needs.release.outputs.typescript == 'true'
    environment: release
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm -C typescript build
      - name: Publish Packages
        run: pnpm -C typescript release
