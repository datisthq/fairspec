[project]
name = "fairspec-metadata"
version = "0.3.0"
description = "Fairspec Python is a fast data management framework built on top of the Fairspec standard and Polars DataFrames"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
  "data",
  "dataframe",
  "fair",
  "fairspec",
  "jsonschema",
  "metadata",
  "polars",
  "python",
  "quality",
  "tableschema",
  "validation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["jsonschema>=4.23", "pydantic>=2.12", "typing-extensions>=4.15"]

[[project.authors]]
name = "Evgeny Karev"

[project.urls]
homepage = "https://fairspec.org/python/"
repository = "https://github.com/datisthq/fairspec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/_test"]
